<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06c755">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LINE Web Chat">
  <meta name="mobile-web-app-capable" content="yes">
  <title>LINE Web Chat</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/app-icon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/app-icon-180.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/icons/apple-touch-icon-114.png">
  <link rel="apple-touch-icon" sizes="57x57" href="/icons/apple-touch-icon-57.png">
  <link rel="apple-touch-startup-image" href="/icons/apple-startup-320x460.png" media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 1)">
  <link rel="apple-touch-startup-image" href="/icons/apple-startup-640x920.png" media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)">
  <link rel="apple-touch-startup-image" href="/icons/apple-startup-640x1096.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="screen">
  <div class="login-card">
    <h1>LINE Web Chat</h1>

    <div class="tab-bar">
      <button type="button" class="tab active" data-tab="password">メール</button>
      <button type="button" class="tab" data-tab="qr">QRコード</button>
    </div>

    <div id="tab-password" class="tab-content active">
      <form id="password-form">
        <label>メールアドレス
          <input type="text" id="email" placeholder="example@line.me" required>
        </label>
        <label>パスワード
          <input type="password" id="password" placeholder="パスワード" required>
        </label>
        <button type="submit" class="btn-primary" id="login-btn">ログイン</button>
      </form>
    </div>

    <div id="tab-qr" class="tab-content">
      <p class="hint">LINEアプリでQRコードを読み取ってください</p>
      <div id="qr-container">
        <button type="button" class="btn-primary" id="qr-start-btn">QRコードを表示</button>
      </div>
    </div>

    <div id="pincode-box" class="hidden">
      <p class="hint">LINEアプリに以下のPINコードを入力してください</p>
      <div id="pincode-display" class="pincode"></div>
    </div>

    <div id="login-status" class="status-msg"></div>

    <button type="button" id="login-back-btn" class="btn-secondary hidden">既存のアカウントに戻る</button>
  </div>
</div>

<div id="chat-screen" class="screen hidden">
  <div id="sidebar">
    <div class="sidebar-header">
      <span>LINE Web Chat</span>
      <button type="button" id="logout-btn">ログアウト</button>
      <button type="button" id="fullscreen-btn">全画面</button>
    </div>
    <div id="account-bar">
      <ul id="account-list"></ul>
      <button type="button" id="add-account-btn" title="アカウントを追加" aria-label="アカウントを追加">＋</button>
    </div>
    <div class="sidebar-tab-bar">
      <button type="button" class="sidebar-tab active" data-sidebar-tab="friends">友達</button>
      <button type="button" class="sidebar-tab" data-sidebar-tab="groups">グループ</button>
    </div>
    <div id="sidebar-friends" class="sidebar-tab-content active">
      <div id="friend-search-wrap">
        <input type="text" id="friend-search" placeholder="友達を検索">
      </div>
      <ul id="friend-list"></ul>
    </div>
    <div id="sidebar-groups" class="sidebar-tab-content">
      <div id="group-search-wrap">
        <input type="text" id="group-search" placeholder="グループを検索">
      </div>
      <ul id="group-list"></ul>
    </div>
  </div>

  <div id="chat-area">
    <div id="chat-placeholder">
      <p>友達を選択してチャットを開始</p>
    </div>

    <div id="chat-panel" class="hidden">
      <div id="chat-header">
        <button type="button" id="back-to-friends">戻る</button>
        <img id="chat-avatar" src="" alt="">
        <div id="chat-header-info">
          <span id="chat-name"></span>
          <span id="chat-subtitle"></span>
        </div>
      </div>
      <div id="messages-container">
        <div id="load-more-indicator" style="display:none;text-align:center;padding:8px;color:#888;font-size:13px;"></div>
        <ul id="message-list"></ul>
      </div>
      <button type="button" id="scroll-bottom-btn" class="hidden" aria-label="最新メッセージへ">⬇</button>
      <div id="upload-progress" class="hidden">
        <div id="upload-progress-label">アップロード中...</div>
        <div id="upload-progress-track"><div id="upload-progress-bar"></div></div>
      </div>
      <div id="reply-preview" class="hidden">
        <div id="reply-preview-content">
          <div id="reply-preview-text"></div>
        </div>
        <button type="button" id="reply-cancel-btn" aria-label="返信キャンセル">×</button>
      </div>
      <form id="send-form">
        <button type="button" class="btn-img-attach" id="image-attach-btn" title="画像を送信" aria-label="画像を送信">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <input type="file" id="image-input" accept="image/*" style="display:none">
        <button type="button" class="btn-video-attach" id="video-attach-btn" title="動画を送信" aria-label="動画を送信">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><polygon points="21 8 17 10.8 17 13.2 21 16 21 8"/></svg>
        </button>
        <input type="file" id="video-input" accept="video/*" style="display:none">
        <button type="button" class="btn-file-attach" id="file-attach-btn" title="ファイルを送信" aria-label="ファイルを送信">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" style="display:none">
        <textarea id="message-input" placeholder="メッセージを入力" rows="2"></textarea>
        <button type="submit" class="btn-send" id="send-btn">送信</button>
      </form>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
